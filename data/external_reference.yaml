# External reference benchmarks — DEFINITIONS. Hand-authored; safe from the refresher.
#
# Why this file exists
# -------------------
# Every score this harness produces is a "how does it behave on my machine" number:
# small-n, our own scaffold, our own quantised builds, our own hardware. That is the
# point — it answers questions no public leaderboard can. But it leaves no way to
# calibrate against results the wider field agrees on.
#
# This file declares which published benchmarks to carry for that calibration. The
# figures themselves live in `external_scores.yaml`, which is machine-generated:
#
#     python3 tools/fetch_external_reference.py --dry-run    # show what would change
#     python3 tools/fetch_external_reference.py              # rewrite the scores file
#
# The split is deliberate. The refresher rewrites the scores file wholesale, so keeping
# definitions separate means a code-only refresh can never clobber hand-written prose —
# which is what makes it safe for anyone to run unattended.
#
# Committed rather than fetched at report time: a benchmark run must not depend on the
# network, and a published number that moves should move in a reviewable diff.
#
# How the figures are rendered
# ----------------------------
# Always in their own tab, never merged into a model row, never averaged into OVERALL,
# never used to rank. A 500-sample leaderboard result and a 25-sample local run do not
# belong in one column.
#
# `column: true` additionally surfaces a benchmark as an inline column in the main table,
# immediately left of OVERALL, in a distinct external-data cell style. It renders only
# when at least one benchmarked model matches a row in that benchmark — an all-empty
# column is dead width, especially on a narrow screen. So which benchmark earns a column
# is a data decision here, not a code change.
#
# The overlap with a local fleet is partial, and which part matters
# ----------------------------------------------------------------
#   SWE-bench Verified  — frontier hosted models only; no locally-runnable build appears
#                         in the top-10 view the upstream mirror publishes. Read it as a
#                         reference BAND, not a comparison: what the field reports for the
#                         work a local model is being asked to substitute for.
#   LiveCodeBench       — carries open-weight rows, so some name model families a local
#                         fleet can host. Those ARE comparable, and unusually informative:
#                         the published figure is full-precision while a local build is
#                         usually quantised, so the gap estimates the quantisation penalty
#                         on your own hardware.
#   Terminal-Bench 2.0  — multi-step terminal work: the closest published proxy for "can
#                         this model drive a coding CLI".
#
# Match on family, never on tag. An upstream `Qwen3.6-27B` and a local `qwen3.6:27b-mlx`
# are the same weights at different precision on different hardware; treating them as one
# row would hide exactly the effect worth measuring.

_meta:
  schema: 2
  warning: "Published third-party figures. Not produced by this harness."
  scores_file: external_scores.yaml
  refresh: "python3 tools/fetch_external_reference.py --dry-run"

# Hugging Face model cards to harvest, most-trusted first. A vendor publishing an
# open-weight model reports its own benchmark numbers, usually in a table that also names
# competitors — so one card can yield SWE-bench Verified for several models a laptop can
# actually run, which no top-N leaderboard view will ever contain.
#
# Scores are tagged self_reported (the card's own model) or third_party (a competitor
# graded on someone else's card), and self-reported wins for the same model+benchmark.
# Neither is independent verification; both are published claims.
#
# Before adding a card, see what it offers:
#     python3 tools/hf_model_cards.py <org>/<model> --all
sources:
  hf_cards:
    - Qwen/Qwen3.6-27B
    - Qwen/Qwen3.6-35B-A3B
    - Qwen/Qwen3.8-27B
    - mistralai/Devstral-Small-2-24B-Instruct-2512
    - zai-org/GLM-4.5-Air
    - google/gemma-4-31B-it
    - google/gemma-4-26B-A4B-it
    - meta-models/Muse-Glimmer-30B
    - Qwen/Qwen3-Coder-30B-A3B-Instruct
    - nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-BF16

benchmarks:

  swe_bench_verified:
    label: "SWE-bench Verified"
    slug: sweVerified          # leaderboard mirror (frontier models)
    aliases:                   # how model cards spell it (case-insensitive, exact match)
      - SWE-bench Verified
      - SWE Bench Verified
      - SWEbench Verified
      - SWE-Bench Verified
    scale: fraction_resolved
    n: 500
    column: true
    # Requested as the inline column. Matches nothing in this fleet today — the upstream
    # mirror publishes a top-10 view and it is entirely frontier hosted models — so the
    # column stays hidden until an open-weight model we run enters that view, at which
    # point it appears on its own with no code change.
    relevance: "coding — the closest external analogue to what this fleet is used for"
    upstream: "https://benchlm.ai/benchmarks/sweVerified"
    source_url: "https://raw.githubusercontent.com/leoncuhk/awesome-llm-bench/main/README.md"
    attribution: "Mirrored from benchlm.ai via leoncuhk/awesome-llm-bench (top 10 view)"
    note: >
      Real GitHub issues from popular Python repos, human-verified 500-instance subset.
      Frontier models only, so read this as a reference band rather than a like-for-like
      comparison.

  live_code_bench:
    label: "LiveCodeBench"
    slug: liveCodeBench
    aliases:
      - LiveCodeBench
      - LiveCodeBench v6
    scale: fraction_resolved
    column: true
    # The one benchmark with real local overlap today, so the inline-column feature is
    # visibly working rather than latent. Remove this line to hide the column.
    relevance: "coding — contamination-resistant, refreshed from recent contest problems"
    upstream: "https://benchlm.ai/benchmarks/liveCodeBench"
    source_url: "https://raw.githubusercontent.com/leoncuhk/awesome-llm-bench/main/README.md"
    attribution: "Mirrored from benchlm.ai via leoncuhk/awesome-llm-bench (top 10 view)"
    note: >
      Carries open-weight entries, so some rows name families a local fleet can host —
      the only place the external and local lists genuinely touch.

  terminal_bench_2:
    label: "Terminal-Bench 2.0"
    slug: terminalBench2
    aliases:
      - Terminal-Bench 2.0
      - Terminal Bench 2
    scale: fraction_resolved
    relevance: >
      agentic — multi-step work in a real terminal, the closest published proxy for
      "can this model drive a coding CLI", which is exactly this fleet's job
    upstream: "https://benchlm.ai/benchmarks/terminalBench2"
    source_url: "https://raw.githubusercontent.com/leoncuhk/awesome-llm-bench/main/README.md"
    attribution: "Mirrored from benchlm.ai via leoncuhk/awesome-llm-bench (top 10 view)"

  # Card-only benchmarks: no slug, because the leaderboard mirror does not carry them.
  # They exist here because open-weight vendors DO report them, which is the whole point.

  swe_bench_pro:
    label: "SWE-bench Pro"
    scale: fraction_resolved
    relevance: "coding — harder, newer SWE-bench variant; NOT comparable to Verified"
    aliases:
      - SWE-bench Pro
      - SWE Bench Pro
    note: >
      A different and harder benchmark than SWE-bench Verified, not a restatement of it.
      Never compare a Pro number against a Verified one.

  swe_bench_multilingual:
    label: "SWE-bench Multilingual"
    scale: fraction_resolved
    relevance: "coding — the same task shape beyond Python"
    aliases:
      - SWE-bench Multilingual
      - SWE Bench Multilingual

  # Further leaderboard slugs available with no code change, only a block here:
  # osWorldVerified, browseComp, arcAgi2, hle.
