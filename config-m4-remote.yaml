ollama:
  # Same M4 machine as config.yaml, reached over the LAN instead of localhost
  # — this file is meant to be run FROM the GPU server (192.168.68.115) to
  # drive benchmarks against the M4's model fleet remotely, the same pattern
  # config-gpu-unified.yaml already uses in the other direction.
  #
  # IP changes when the M4 changes network — 192.168.68.106 -> 172.30.185.105
  # -> 192.168.68.110 -> 192.168.68.109 (verified 2026-08-21 via
  # `ipconfig getifaddr en0` on the M4 itself, and curl'd on :11434). Four
  # addresses in a week: treat this value as stale by default and re-check with
  # `curl http://<ip>:11434/api/tags` before every remote run.
  #
  # NOTE for whoever drives this file: prefer running M4 models FROM the M4
  # (config-m4-fill.yaml uses localhost) whenever the laptop is available.
  # Inference happens on the M4 either way, so driving remotely buys no speed,
  # and it costs two things: pressure.py::_is_local() falls back to timing-only
  # swap detection instead of reading the M4's real vm_stat counters, and the
  # EvalPlus sandbox executes on the driving host rather than the one under
  # test. Remote is for when the laptop cannot be sat in front of, not the
  # default.
  base_url: "http://192.168.68.109:11434/v1"
  api_key: "ollama"
  timeout: 600
  max_tokens: 4096
  think_max_tokens: 16384
  default_ctx: 32768
  sample_seed: 42

models:
  # Kept identical to config.yaml's own list (as of 2026-08-20) rather than a
  # hand-maintained copy — the previous version of this file drifted stale
  # against config.yaml within days and silently missed several models
  # (qwen3.8 variants, qwen3.6:27b-mlx) added there since. Re-sync from
  # config.yaml if this drifts again rather than editing by hand.
  - llama3.2:3b
  - llama3.1:8b
  - qwen2.5-coder:7b
  - model: gemma4-12b-agentic:latest
    ctx: 16384
  - model: gemma4-12b-agentic-mtp:latest
    ctx: 16384
  - model: codestral:22b
    ctx: 16384
  - model: devstral-small-2:latest
    ctx: 16384
  - model: gemma4:26b-mlx
    ctx: 32768
  - model: nemotron-3-nano:30b
    ctx: 32768
  - model: gemma4:31b-mlx
    ctx: 32768
  - qwen3:32b
  - qwen3-32b-nothink:latest
  - qwen3-coder:latest
  - model: qwen3.6:27b
    ctx: 32768
  - model: muse-glimmer:30b-mlx
    ctx: 32768
    think: false
  - model: muse-glimmer:30b-mlx
    ctx: 32768
    think: true
  - model: qwen3.6:35b-mlx
    ctx: 32768
    think: false
  - model: qwen3.6:35b-mlx
    ctx: 32768
    think: true
  - model: qwen3.8:27b-mlx
    ctx: 32768
    think: false
  - model: qwen3.8:27b-mlx
    ctx: 32768
    think: true
  # Not in config.yaml's own list (added via ad-hoc runs outside the base
  # config), but present in merged.summary.json with missing bfcl_irrelevance/
  # humaneval_plus/mbpp_plus cells to fill — ctx matches every other model's
  # default_ctx of 32768, consistent with their existing recorded effective_ctx.
  - qwen2.5-coder:32b
  - model: qwen3.8:27b
    ctx: 32768
  - model: qwen3.6:27b-mlx
    ctx: 32768

benchmarks:
  bfcl:
    enabled: true
    n_samples: 100

  bfcl_irrelevance:
    enabled: true
    n_samples: 100

  humaneval_plus:
    enabled: true
    n_samples: 100

  mbpp_plus:
    enabled: true
    n_samples: 100

output:
  dir: "results"
  save_raw: true

execution:
  # Declared explicitly, not inferred — without this, collect_model_info()
  # falls back to the raw IP (192.168.68.110), which doesn't match the
  # canonical "MacBook M4" label used everywhere else for this machine.
  # That mismatch triggered a cross-host conflict in the cell-level merge
  # and silently wiped 6 models' existing core-7/bfcl scores down to just
  # the new columns before it was caught (see docs/ROADMAP.md).
  host_label: "MacBook M4"
  parallel_models: false
  max_workers: 2
  # Kept enabled for the timing-based degradation detection (decode rate
  # collapse, TTFT ceiling), which works fine over the network. But the
  # vm_stat-based swap corroboration that decides hard-vs-soft abort reads
  # *this* process's host — the GPU server, not the M4 — so it cannot
  # actually see real M4 memory pressure when run remotely like this. A trip
  # will still fire on slowness, just always classified soft (one sample
  # skipped, run continues) rather than hard (whole model skipped).
  memory_guard:
    enabled: true
    poll_interval: 1.0
    ttft_ceiling_seconds: 300
    token_stall_seconds: 20
    decode_degradation_factor: 10
    baseline_window_seconds: 5
    baseline_tokens: 16
    window_seconds: 5
    swap_bytes_per_sec: 33554432
    swap_sustain_seconds: 5
    min_decode_tps: 0.0
    min_decode_tps_after_tokens: 32
