ollama:
  base_url: "http://192.168.68.115:11434/v1"
  api_key: "ollama"
  timeout: 600
  max_tokens: 8192
  default_ctx: 131072
  sample_seed: 42

models:
  # Unified pool candidates (6x P100, 96GB VRAM; GPU0/RTX2080Ti excluded —
  # mismatched 11GB card was a repeated single-GPU OOM bottleneck at high ctx).
  #
  # ctx values below are each model's confirmed max context with FULL layer
  # offload (verified via "offloaded N/N layers to GPU" in the ollama-unified
  # log), not just "loads without erroring" — partial offload silently
  # degrades to CPU-speed generation and would invalidate speed comparisons.
  # Bisected 2026-08-15 on Ollama 0.32.9.

  # Compute-graph is much steeper here (47GiB at native ctx 131072) — full
  # 48/48 offload only up to 8192; 16384 is 44/48, 32768 drops to 11/48.
  - model: MichelRosselli/GLM-4.5-Air:Q3_K_M
    ctx: 8192

  # Dense 31.3B, native ctx 262144. Full 61/61 offload up to 98304; 114688+
  # thrashes (OOM-loops, mostly on the excluded GPU0 when it was still in
  # the pool). FlashAttention is disabled for this architecture on this
  # ollama build, which is likely why its ceiling is tighter than qwen3.6's.
  - model: gemma4:31b
    ctx: 98304

  # Confirmed clean full offload at its production ctx already (no ceiling
  # issue found) — GPU_OVERHEAD=268435456 was the fix that made this work,
  # not a ctx reduction.
  - model: qwen3-coder-next:sovereign-128k
    ctx: 131072

  # Native long-context MoE (iRoPE) — full 49/49 offload at its full native
  # ctx, ~90GiB total footprint (the model that most fully uses this pool).
  - model: llama4:scout
    ctx: 131072

  # Native ctx is 262144 (confirmed via model_info, not extrapolation) — full
  # 63/63 offload with massive headroom (only ~39GiB used of the ~96-107GiB
  # pool). Best quality-per-context-dollar of everything tested this session.
  - model: qwen3.6-128k:latest
    ctx: 262144

  # Meta's Aug 2026 agentic model, purpose-built for cheap long context.
  # Needed Ollama >=0.32.8 for architecture support (not available pre-upgrade).
  # Full 53/53 offload at its full native ctx on the FIRST attempt, only
  # ~6-6.5GiB used per P100 — the most VRAM-efficient model tested this session.
  - model: hf.co/bartowski/Muse-Glimmer-30B-GGUF:Q4_K_M
    ctx: 131072

  # Pool-b incumbent for comparison (run on unified pool too, or keep separate)
  - model: qwen3-coder:30b-sovereign
    ctx: 32768

  # Released 2026-08-03 (open weights ~1wk later); same "qwen35" family
  # lineage as qwen3.6, and it shows — full 66/66 offload at its full native
  # ctx 262144 with no ceiling issue found, same pattern as qwen3.6-128k.
  # Ollama's /api/tags capabilities list omits "tools" for this model but
  # tool-calling works correctly in practice (verified directly) — a metadata
  # gap, not a real limitation. Pulled via hf.co/unsloth (bartowski's GGUF
  # repeatedly hit a reproducible 504 at the final pull step across 5 tries
  # with different timeouts — a bartowski-repo-specific issue, not a network
  # timeout; unsloth's single-blob GGUF for the same model pulled cleanly).
  - model: hf.co/unsloth/Qwen3.8-27B-GGUF:Q4_K_M
    ctx: 262144

  # Ordered last deliberately (2026-08-17), not alphabetically or by ctx like
  # the others above — this model is dramatically slower than everything else
  # in the pool (~4.5 tok/s vs 5-15+ for the rest, R1-style verbose reasoning
  # on every sample) and scored 0% on bfcl, so it's the lowest-value model to
  # gate the other 8 behind. A prior run got ~65% through this model's 7
  # benchmarks before being killed to reprioritize the other 8 first — nothing
  # was lost from that (checkpoints only write after a model's full benchmark
  # set completes), but re-running it isn't wasted either: mmlu/arc/gsm8k
  # scored 100%/100%/96% before the kill, worth seeing if that holds.
  # Compute-graph buffer for deepseek-r1:70b scales ~0.000128 GiB/token and
  # must fit on a single P100 (16GB) — full 81/81 offload only up to 32768;
  # 65536 already drops to 44/81, 131072 (this model's native ctx) is 0/81.
  - model: deepseek-r1:70b
    ctx: 32768

# Matches config.yaml's (the M4's) benchmark group n_samples exactly, plus
# sample_seed: 42 already set above — same questions, same sample counts, so
# GPU-server scores are directly comparable to the M4 baseline, not just
# roughly similar. Added 2026-08-15 to fill the coverage gap: these 8 models
# previously had bfcl (all) plus mmlu/gsm8k/humaneval (3 of them only, from
# an earlier partial baseline) — this run gives full parity with the M4's
# 7-benchmark + bfcl coverage.
benchmarks:
  reasoning:
    enabled: true
    dataset: "cais/mmlu"
    subjects:
      - "abstract_algebra"
      - "logical_fallacies"
      - "formal_logic"
      - "high_school_mathematics"
      - "philosophy"
    n_samples: 20

  math:
    enabled: true
    dataset: "openai/gsm8k"
    split: "test"
    n_samples: 25

  coding:
    enabled: true
    datasets:
      - "openai/openai_humaneval"
      - "google-research-datasets/mbpp"
    n_samples: 20
    execution_timeout: 10

  sql:
    enabled: true
    dataset: "xlangai/spider"
    n_samples: 20

  philosophical:
    enabled: true
    n_samples: 10
    judge_rubric:
      - "Depth of reasoning (1-5)"
      - "Coherence and logical consistency (1-5)"
      - "Acknowledgment of multiple perspectives (1-5)"
      - "Originality of insight (1-5)"
      - "Clarity of expression (1-5)"

# Same judge as config.yaml — a consistent scorer across both machines is
# what makes the philosophical column comparable at all.
judge:
  provider: "ollama"
  ollama_single_model: "llama3.1:8b"
  timeout: 180

output:
  dir: "results"
  save_raw: true

execution:
  parallel_models: false
  max_workers: 1
  memory_guard:
    enabled: false