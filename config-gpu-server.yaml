ollama:
  base_url: "http://192.168.68.115:11434/v1"
  api_key: "ollama"
  timeout: 300
  max_tokens: 4096
  default_ctx: 32768
  sample_seed: 42

models:
  # Incumbent sovereign heavyweight — pool-a (4x P100, 64GB). This has never been
  # benchmarked; measuring it validates the "keep the 79.7B" thesis quantitatively.
  - model: qwen3-coder-next:sovereign-128k
    ctx: 131072

  # A/B candidates that FIT pool-b (2x P100, 32GB): incumbent 30b vs long-context 36B.
  - model: qwen3-coder:30b-sovereign
    ctx: 32768
  - model: qwen3.6-128k:latest
    ctx: 32768

  # RTX pool (11435, 11GB) lightweight candidates for scorer/human_ideas_extractor.
  - model: qwen2.5-coder:7b
    ctx: 8192
  - model: qwen2.5-coder:14b
    ctx: 16384

  # NOTE: deepseek-r1:70b (42.5GB), GLM-4.5-Air (57GB), llama4:scout (67.4GB),
  # minimax-m2.1 (55.7GB) are intentionally omitted — none fits a 64GB pool with
  # loaded KV cache (confirmed by prior server-side triage).

output:
  dir: "results"
  save_raw: true

execution:
  parallel_models: false
  max_workers: 1
  # Memory guard polls LOCAL RAM; inference runs remotely on the GPU server,
  # so local swap pressure is meaningless here — keep it disabled.
  memory_guard:
    enabled: false
