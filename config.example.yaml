ollama:
  base_url: "http://localhost:11434/v1"
  api_key: "ollama"
  timeout: 600
  # Answer budget. A runaway cap, not a target — models stop at EOS long before
  # it, so a generous value costs nothing except on pathological loops. Too
  # tight is harmful: a model cut off mid-answer scores zero on a question it
  # might have got right, measuring the budget rather than the model.
  max_tokens: 4096
  # Thinking needs several times the budget — chain-of-thought is spent before
  # the answer begins.
  think_max_tokens: 16384
  default_ctx: 32768  # Default num_ctx for all models (per-model ctx: overrides)
  # Samples are drawn with this seed rather than taken from the head of the
  # dataset, so every model sees an identical representative set. MMLU also
  # stratifies across its subjects. Scores are only comparable at a fixed seed.
  sample_seed: 42

# Model list: use strings for simple names, or dicts to set per-model ctx.
# ctx=N sets num_ctx in the Ollama API call — limits KV cache so VRAM
# estimates are realistic. The VRAM estimate on the dashboard uses this ctx.
# Without it, the global default_ctx applies.
models:
  - llama3.1:8b
  - qwen2.5:7b
  - qwen2.5-coder:7b
  - model: qwen3:32b
    ctx: 16384  # Per-model override: use 16K instead of the 32K default
  # The same model can be benchmarked under different settings and appear as
  # separate dashboard rows. `think` is only sent to models that declare the
  # capability; `label` overrides the auto-generated "<model> +think" name.
  - model: muse-glimmer:30b-mlx
    ctx: 32768
    think: false
  - model: muse-glimmer:30b-mlx
    ctx: 32768
    think: true          # -> dashboard row "muse-glimmer:30b-mlx +think"

# Judge configuration for philosophical benchmark.
# Set provider to choose the judge backend — all config keys live at the
# same level; only the ones relevant to the selected provider are used.
#
#   provider: "opencode"   — cloud via opencode CLI (free, no API key)
#   provider: "openai"     — generic OpenAI-compatible API
#   provider: "ollama"     — single local Ollama model
#   provider: "ensemble"   — multiple local models, scores averaged
#
judge:
  provider: "ollama"

  # Used when provider is "opencode" or "openai":
  # cloud_model: "opencode/deepseek-v4-flash-free"

  # Used when provider is "ollama":
  ollama_single_model: "llama3.1:8b"

  # Used when provider is "ensemble":
  # ensemble_models:
  #   - qwen3:8b
  #   - deepseek-r1:7b
  #   - llama3.1:8b

  # Used when provider is "openai":
  # base_url: "https://api.deepseek.com/v1"
  # api_key: "${DEEPSEEK_API_KEY}"

benchmarks:
  reasoning:
    enabled: true
    dataset: "cais/mmlu"
    subjects:
      - "abstract_algebra"
      - "logical_fallacies"
      - "formal_logic"
      - "high_school_mathematics"
      - "philosophy"
    n_samples: 20

  math:
    enabled: true
    dataset: "openai/gsm8k"
    split: "test"
    n_samples: 50

  coding:
    enabled: true
    datasets:
      - "openai/openai_humaneval"
      - "google-research-datasets/mbpp"
    n_samples: 30
    execution_timeout: 10

  sql:
    enabled: true
    dataset: "xlangai/spider"
    n_samples: 30

  philosophical:
    enabled: true
    n_samples: 10
    judge_rubric:
      - "Depth of reasoning (1-5)"
      - "Coherence and logical consistency (1-5)"
      - "Acknowledgment of multiple perspectives (1-5)"
      - "Originality of insight (1-5)"
      - "Clarity of expression (1-5)"

  speed:
    enabled: false
    n_runs: 3

output:
  dir: "results"
  save_raw: true

execution:
  parallel_models: false
  max_workers: 2
  # Aborts a thrashing generation mid-call. Detection is timing-primary and
  # burst-immune (rates averaged over wall-clock windows, never per-token gaps),
  # corroborated by an OS pressure sensor: vm_stat on macOS, /proc/vmstat on
  # Linux, timing-only elsewhere. The same config works on GPU and CPU because
  # the main signal is relative to each call's own established rate.
  memory_guard:
    enabled: true
    poll_interval: 1.0
    ttft_ceiling_seconds: 300     # backstop; cold load and thinking are legitimate
    token_stall_seconds: 20
    decode_degradation_factor: 10 # collapse vs this call's own established rate
    baseline_window_seconds: 5
    baseline_tokens: 16
    window_seconds: 5
    swap_bytes_per_sec: 33554432  # 32 MB/s sustained swap-out = real thrash
    swap_sustain_seconds: 5
    # "Too slow to be worth benchmarking" — a different question from thrashing.
    # 0 disables. GPU / Apple Silicon: ~3.0. CPU-only: leave at 0.
    min_decode_tps: 0.0
    min_decode_tps_after_tokens: 32
