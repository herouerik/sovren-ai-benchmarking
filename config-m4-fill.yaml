# Continuation of the GPU server's M4 fill (b7a1721: "12 of 15 models done"),
# run locally on the M4 instead of remotely — the remote job stopped because
# the M4 was pulled off the network, and localhost needs no network at all.
#
# ctx and think values are copied from config-m4-remote.yaml rather than
# re-derived, so these rows stay comparable with the 12 the GPU server already
# filled. Same n=100 and the same sample_seed 42, so every model is scored on
# an identical item set.
#
# Scope differs from b7a1721's "remaining" list in three ways, all verified
# against merged.summary.json rather than taken from the note:
#
#   + devstral-small-2:latest — missing all three categories and absent from
#     that list. Healthy model (16.3 tok/s, bfcl 0.85), so it is a real gap.
#   + codestral:22b — missing all three and also absent from the list. Split
#     into config-m4-fill-codestral.yaml because it declares no `tools`
#     capability (caps: completion, insert), which is why its recorded bfcl is
#     0.0. The runner applies every enabled benchmark to every model, so
#     leaving it here would have written a fake 0.00 bfcl_irrelevance — a
#     harness artefact, not a restraint measurement.
#   - needle2 — missing humaneval_plus/mbpp_plus, deliberately not filled. It
#     is a 45M tool-calling model; EvalPlus on it measures the benchmark's
#     scope, not the model. See config-needle.yaml.

ollama:
  base_url: "http://localhost:11434/v1"
  api_key: "ollama"
  timeout: 600
  max_tokens: 4096
  think_max_tokens: 16384
  default_ctx: 32768
  sample_seed: 42

models:
  # Ordered fastest-first (recorded tok/s) so a partial run still lands the
  # cheapest cells — this is an overnight-scale job and may be interrupted.
  - model: qwen3.6:35b-mlx      # 72.0 t/s
    ctx: 32768
    think: false
  - model: qwen3.6:35b-mlx      # 72.2 t/s
    ctx: 32768
    think: true
  - qwen3-coder:latest          # 60.3 t/s
  - model: qwen3.8:27b-mlx      # 29.8 t/s (+think)
    ctx: 32768
    think: true
  - model: devstral-small-2:latest   # 16.3 t/s
    ctx: 16384
  - qwen3:32b                   # 11.6 t/s
  # qwen3-32b-nothink:latest — CUT 2026-08-21. Not a distinct configuration in
  # this harness: _effective_system() appends /no_think to any model whose name
  # contains "qwen3", so the bare `qwen3:32b` entry above already runs without
  # thinking. The two tags have byte-identical scores across all seven existing
  # benchmarks (0.85/0.95/1.00/0.85/0.60/0.60/0.88), consistent with that.
  # Running it would have reproduced qwen3:32b's three cells rather than adding
  # information, at ~3h on an 11.6 tok/s model.
  - model: qwen3.8:27b          # 8.5 t/s — slowest, last
    ctx: 32768

benchmarks:
  bfcl_irrelevance:
    enabled: true
    n_samples: 100
  humaneval_plus:
    enabled: true
    n_samples: 100
  mbpp_plus:
    enabled: true
    n_samples: 100

output:
  dir: "results"
  save_raw: true

execution:
  parallel_models: false
  max_workers: 1
  # Idle this long between every test (model x benchmark) so the M4 sheds heat
  # instead of sitting at sustained load for the whole fill. Sustained thermal
  # throttling would leave the accuracy scores intact but quietly depress the
  # tok/s column part-way through the run, making speed non-comparable against
  # the rows the GPU server already filled.
  cooldown_seconds: 120
  # Explicit because base_url is localhost: without it the host label resolves
  # to the generic same-machine string rather than "MacBook M4", and these rows
  # would not merge alongside the 12 the GPU server filled. This is the same
  # class of mislabelling as 7db02af/b7a1721, which cost two recoveries.
  host_label: "MacBook M4"
  memory_guard:
    enabled: true
    poll_interval: 1.0
    ttft_ceiling_seconds: 300
    token_stall_seconds: 20
    decode_degradation_factor: 10
    baseline_window_seconds: 5
    baseline_tokens: 16
    window_seconds: 5
    swap_bytes_per_sec: 33554432
    swap_sustain_seconds: 5
    min_decode_tps: 0.0
    min_decode_tps_after_tokens: 32
