# Cactus Needle 2 (45M, CQ2) behind tools/needle_shim.py.
#
# Start the shim first:
#     python tools/needle_shim.py --port 11499
#     python run_benchmark.py --config config-needle.yaml
#
# Only `bfcl` is enabled, and that is the point. Needle is a 45M-parameter
# model purpose-built for tool calling, device control and structured
# extraction. Running MMLU/GSM8K/HumanEval/Spider against it would produce
# near-zero scores that describe the benchmark's scope, not the model —
# the same uninformative row a crashed load produces. Tool calling is the
# one cell in this suite it is actually built to answer.
#
# sample_seed is 42 (the harness default) so the stratified selection lands
# on the identical 100 BFCL items every other model in results/ was scored
# on — the comparison is only meaningful if the item set matches.

ollama:
  base_url: "http://127.0.0.1:11499/v1"
  api_key: "needle"
  timeout: 600
  # Needle's own default; it emits a decision object, not prose.
  max_tokens: 256
  default_ctx: 4096
  sample_seed: 42

models:
  - needle2

benchmarks:
  bfcl:
    enabled: true
    n_samples: 100

output:
  dir: "results"
  save_raw: true

execution:
  parallel_models: false
  max_workers: 1
  # The shim runs on this machine, so base_url is localhost and the host
  # label would otherwise resolve to the generic same-machine string. Naming
  # the M4 explicitly is what lets this row merge alongside the other M4
  # results instead of appearing as a separate unregistered host.
  host_label: "MacBook M4"
  memory_guard:
    enabled: true
    poll_interval: 1.0
    ttft_ceiling_seconds: 300
    token_stall_seconds: 20
    decode_degradation_factor: 10
    baseline_window_seconds: 5
    baseline_tokens: 16
    window_seconds: 5
    swap_bytes_per_sec: 33554432
    swap_sustain_seconds: 5
    # Left at 0. Needle decodes at ~900-1700 tok/s in ~130MB of RAM; a
    # slow-model floor has nothing to do on this row, and any non-zero
    # value here is only a risk of aborting healthy samples.
    min_decode_tps: 0.0
    min_decode_tps_after_tokens: 32
