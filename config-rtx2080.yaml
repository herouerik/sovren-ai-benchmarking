ollama:
  # The RTX 2080 Ti (GPU0) previously excluded from the unified 6xP100 pool
  # (config-gpu-unified.yaml) — mismatched card, was a repeated OOM
  # bottleneck when part of that pool at high context. Standing idle since,
  # aside from a leftover qwen2.5-coder:7b instance from the old Brahma
  # Pool A/B/Meta topology (unloaded 2026-08-20, not relied on anymore).
  #
  # Served here by a separate, dedicated `ollama serve` process — plain
  # background process, not a systemd unit, since this session has no root
  # to install one. CUDA_VISIBLE_DEVICES=0 scopes it to only this card;
  # OLLAMA_MODELS points at the shared model store (read-only access is
  # enough to serve already-pulled models; pulling anything new needs the
  # ollama user). See /tmp/ollama-gpu0.log for its own startup log.
  base_url: "http://192.168.68.115:11437/v1"
  api_key: "ollama"
  timeout: 600
  max_tokens: 4096
  think_max_tokens: 16384
  default_ctx: 16384
  sample_seed: 42

models:
  # Conservative context to start: this card's whole reason for exclusion
  # from the unified pool was OOM at high context, so ctx is bisected up
  # from a known-safe value rather than assumed. 11GB total, ~186MB desktop
  # overhead (Xorg/gnome-shell — this card also drives the physical
  # display), so real budget is ~10.8GB for weights + KV cache.
  - model: qwen2.5-coder:7b
    ctx: 16384
  - model: llama3.1:8b       # cross-host bridge model — already tested on
    ctx: 16384                # the M4, makes this card directly comparable
  - model: qwen2.5-coder:14b
    ctx: 8192                 # 9.0GB weights alone; smaller ctx deliberately

benchmarks:
  reasoning:
    enabled: true
    dataset: "cais/mmlu"
    subjects:
      - "abstract_algebra"
      - "logical_fallacies"
      - "formal_logic"
      - "high_school_mathematics"
      - "philosophy"
    n_samples: 20

  math:
    enabled: true
    dataset: "openai/gsm8k"
    split: "test"
    n_samples: 25

  coding:
    enabled: true
    datasets:
      - "openai/openai_humaneval"
      - "google-research-datasets/mbpp"
    n_samples: 20
    execution_timeout: 10

  sql:
    enabled: true
    dataset: "xlangai/spider"
    n_samples: 20

  philosophical:
    enabled: true
    n_samples: 10
    judge_rubric:
      - "Depth of reasoning (1-5)"
      - "Coherence and logical consistency (1-5)"
      - "Acknowledgment of multiple perspectives (1-5)"
      - "Originality of insight (1-5)"
      - "Clarity of expression (1-5)"

  bfcl:
    enabled: true
    n_samples: 20

  bfcl_irrelevance:
    enabled: true
    n_samples: 20

# Local judge, same as config-gpu-unified.yaml — a consistent scorer is what
# makes the philosophical column comparable across all three hosts.
judge:
  provider: "ollama"
  ollama_single_model: "llama3.1:8b"
  timeout: 180

output:
  dir: "results"
  save_raw: true

execution:
  # Declared explicitly, not inferred — same reasoning as the GPU server's
  # own host_label (docs/ROADMAP.md "Host identity"). Deliberately distinct
  # from "i9 GPU server" even though it's physically the same machine: the
  # dashboard's per-host speed/VRAM comparisons would be meaningless if a
  # single P100 and a single 2080 Ti shared one label.
  host_label: "RTX 2080 Ti (GPU0)"
  parallel_models: false
  max_workers: 1
  memory_guard:
    enabled: true
    poll_interval: 1.0
    ttft_ceiling_seconds: 300
    token_stall_seconds: 20
    decode_degradation_factor: 10
    baseline_window_seconds: 5
    baseline_tokens: 16
    window_seconds: 5
    swap_bytes_per_sec: 33554432
    swap_sustain_seconds: 5
    min_decode_tps: 0.0
    min_decode_tps_after_tokens: 32
